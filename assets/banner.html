<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ai-process banner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 420px; overflow: hidden; background: #0c0805; }
  body {
    position: relative; font-family: Inter, sans-serif; color: #f8f2e9;
    background:
      radial-gradient(640px 380px at 86% 30%, rgba(255,122,26,.34), transparent 65%),
      radial-gradient(520px 340px at 0% 100%, rgba(255,196,40,.14), transparent 65%),
      linear-gradient(180deg, #1a0f06, #0c0805 90%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,176,72,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(255,176,72,.07) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 60% 80% at 75% 40%, #000 15%, transparent 75%);
  }
  .left { position: absolute; left: 64px; top: 50px; width: 720px; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; letter-spacing: -.02em; }
  .brand img { width: 46px; height: 46px; }
  .brand span { color: #85776a; font-weight: 600; font-size: 18px; margin-left: 6px; font-family: "JetBrains Mono", monospace; }
  h1 { font-size: 50px; line-height: 1.04; letter-spacing: -.035em; font-weight: 800; margin-top: 26px; }
  .g { background: linear-gradient(120deg, #ff6414, #ff9a1f 45%, #ffd43f); -webkit-background-clip: text; color: transparent; }
  p { color: #b9aa96; font-size: 19px; line-height: 1.5; margin-top: 18px; width: 560px; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; padding: 7px 13px; border-radius: 999px; border: 1px solid rgba(255,176,72,.28); background: rgba(255,255,255,.04); color: #e8dccb; }
  .chip b { color: #ffa928; font-weight: 700; }
  svg.flow { position: absolute; right: 40px; top: 40px; }
  .label { font-family: "JetBrains Mono", monospace; font-size: 13px; fill: #cdbfac; }
  .dim { fill: #85776a; font-size: 12px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="left">
  <div class="brand"><img src="logo.svg" alt="">ai-process <span>ai-process.dev</span></div>
  <h1>Open-source infrastructure<br>for <span class="g">production LLMs</span></h1>
  <p>Self-hosted gateway, token accounting and a web console. Small Go services, Apache-2.0, no enterprise edition.</p>
  <div class="chips">
    <span class="chip"><b>Keystone</b> · KTMS</span>
    <span class="chip"><b>light</b>-tokenmeter</span>
    <span class="chip"><b>ktms</b>-admin</span>
  </div>
</div>

<svg class="flow" width="520" height="340" viewBox="0 0 520 340">
  <defs>
    <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#ff6414"/><stop offset=".5" stop-color="#ff9a1f"/><stop offset="1" stop-color="#ffd43f"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".3" r=".9">
      <stop offset="0" stop-color="#3a220d"/><stop offset="1" stop-color="#1a120b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <!-- clients converge into the switchboard -->
  <g fill="none" stroke="url(#gr)" stroke-width="2.2" stroke-linecap="round" opacity=".85">
    <path d="M60 70 C 130 70, 140 170, 205 170"/>
    <path d="M60 170 H 205"/>
    <path d="M60 270 C 130 270, 140 170, 205 170"/>
    <path d="M315 170 C 370 170, 380 60, 440 60"/>
    <path d="M315 170 C 370 170, 385 130, 440 130"/>
    <path d="M315 170 C 370 170, 385 210, 440 210"/>
    <path d="M315 170 C 370 170, 380 280, 440 280"/>
  </g>
  <g fill="#ffa928"><circle cx="60" cy="70" r="6"/><circle cx="60" cy="170" r="6"/><circle cx="60" cy="270" r="6"/></g>
  <text class="label" x="22" y="50">service</text>
  <text class="label" x="22" y="150">agent</text>
  <text class="label" x="22" y="250">OpenAI SDK</text>
  <!-- core -->
  <rect x="200" y="118" width="120" height="104" rx="20" fill="#ff8a1e" opacity=".35" filter="url(#glow)"/>
  <rect x="200" y="118" width="120" height="104" rx="20" fill="url(#core)" stroke="url(#gr)" stroke-width="2"/>
  <text x="260" y="166" text-anchor="middle" font-family="Inter" font-weight="800" font-size="24" fill="url(#gr)">KTMS</text>
  <text x="260" y="190" text-anchor="middle" class="label dim">effort · limits</text>
  <!-- destinations -->
  <g font-family="JetBrains Mono" font-size="13">
    <rect x="440" y="44" width="76" height="32" rx="9" fill="#1a120b" stroke="rgba(255,176,72,.35)"/><text x="478" y="65" text-anchor="middle" fill="#e8dccb">OpenAI</text>
    <rect x="440" y="114" width="76" height="32" rx="9" fill="#1a120b" stroke="rgba(255,176,72,.35)"/><text x="478" y="135" text-anchor="middle" fill="#e8dccb">Claude</text>
    <rect x="440" y="194" width="76" height="32" rx="9" fill="#1a120b" stroke="rgba(255,176,72,.35)"/><text x="478" y="215" text-anchor="middle" fill="#e8dccb">Gemini</text>
    <rect x="440" y="264" width="76" height="32" rx="9" fill="#1a120b" stroke="#ffa928"/><text x="478" y="285" text-anchor="middle" fill="#ffd54a">your GPU</text>
  </g>
  <!-- usage down to meter -->
  <path d="M260 222 V 300" stroke="#85776a" stroke-width="1.6" stroke-dasharray="4 5" fill="none"/>
  <rect x="196" y="300" width="128" height="30" rx="9" fill="#1a120b" stroke="rgba(255,176,72,.28)"/>
  <text x="260" y="320" text-anchor="middle" class="label">tokenmeter</text>
</svg>
</body>
</html>
